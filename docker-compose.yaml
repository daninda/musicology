version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: prod-musicology-postgresql
    environment:
      POSTGRES_USER: danila
      POSTGRES_PASSWORD: danila
      POSTGRES_DB: musicology
    volumes:
      - prod-musicology-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
    container_name: prod-musicology-backend
    ports:
      - "5025:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=musicology;Username=danila;Password=danila
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: prod-musicology-frontend
    ports:
      - "80:80"
    restart: always

volumes:
  prod-musicology-data:

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/catalog.css">
    <title>Каталог | Музология</title>
</head>

<body>
    <header>
        <img src="icons/logo.svg" alt="Музология Логотип" class="logo" />
        <nav>
            <ul>
                <li class="nav-item"><a href="index.html">Главная</a></li>
                <li class="nav-item"><a href="news.html">Новости</a></li>
                <li class="nav-item"><a href="catalog.html">Каталог</a></li>
                <li class="nav-item"><a href="sell.html">Добавить товар</a></li>
                <li class="nav-item"><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main class="catalog-main">
        <aside class="filters">
            <form id="filter-form">
                <h3>Фильтры</h3>

                <label for="category">Категория:</label>
                <select id="category" name="category">
                    <option value="-1">Все категории</option>
                    <option value="0">Гитары</option>
                    <option value="1">Ударные</option>
                    <option value="2">Клавишные</option>
                    <option value="3">Аудиооборудование</option>
                    <option value="4">Аксессуары</option>
                </select>

                <label for="price-min">Цена от (₽):</label>
                <input type="number" id="price-min" name="price-min" placeholder="Минимум" min="0">

                <label for="price-max">Цена до (₽):</label>
                <input type="number" id="price-max" name="price-max" placeholder="Максимум" min="0">

                <button type="submit">Применить фильтры</button>
            </form>
        </aside>

        <div style='width: 100%;'>
            <div class="products"></div>
            
            <div class="pagination-controls">
                <button id="prev-page" disabled>Предыдущая страница</button>
                <button id="next-page">Следующая страница</button>
            </div>
        </div>

        <button id='scroll-button' type='button'>Наверх</button>
    </main>

    <footer>
        <div class='footer-content'>
            <img src="icons/logo.svg" alt="Логотип Музология" class='footer-logo' />
            <table class="footer-contacts">
                <tr>
                    <td>Москва:</td>
                    <td><a href='tel:+79999999999'>+7 (999) 999-99-99</a></td>
                </tr>
                <tr>
                    <td>Волгоград:</td>
                    <td><a href='tel:+79999999999'>+7 (999) 999-99-99</a></td>
                </tr>
                <tr>
                    <td>Самара:</td>
                    <td><a href='tel:+79999999999'>+7 (999) 999-99-99</a></td>
                </tr>
            </table>
        </div>
    </footer>

    <script src="scripts/scroll.js"></script>
    <script src="scripts/ajax/catalog.js"></script>
</body>

</html>
